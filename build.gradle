plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

base {
    archivesName = 'antirat'
}

version = '1.0.0'

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'com.google.code.gson:gson:2.11.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
    mods {
        'antirat' {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            vmArgs '-Dtokenstealer.endpoint=http://127.0.0.1:8989/collect'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

tasks.register('copyTestRat', Copy) {
    dependsOn project(':test-rat').tasks.named('jar')
    from project(':test-rat').tasks.named('jar').flatMap { it.archiveFile }
    into layout.projectDirectory.dir('run/mods')
}
